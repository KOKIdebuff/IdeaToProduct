rubric:
  id: developer_tool_scoring
  version: 1.0.0
  profile_ref: developer_tool@0.3.2
  integer_only: true
  minimum: 1
  maximum: 10
  aggregation: weighted_arithmetic_mean
  minimum_weight_coverage: 0.8
  missing_evidence: renormalize_available_weights_partial
  tie_break: evidence_coverage_then_shared_rank
  change_rationale: Initial equal-weight developer-tool scoring baseline.
  changelog:
    - {version: 1.0.0, date: "2026-09-01", reason: Initial approved equal-weight baseline.}
score_bands: &score_bands
  - {minimum: 1, maximum: 2, meaning: Clearly insufficient or supported by negative evidence.}
  - {minimum: 3, maximum: 4, meaning: Limited capability or weak evidence coverage.}
  - {minimum: 5, maximum: 6, meaning: Meets baseline expectations.}
  - {minimum: 7, maximum: 8, meaning: Strong verified capability.}
  - {minimum: 9, maximum: 10, meaning: Clearly leading with multiple direct supporting evidence records.}
dimensions:
  - {id: workflow_fit, definition: Fit with the target developer workflow, weight: 0.2, allowed_claim_categories: [competitor, product, user], minimum_evidence_count: 1}
  - {id: developer_experience, definition: Clarity speed and usability of the developer experience, weight: 0.2, allowed_claim_categories: [competitor, product, user], minimum_evidence_count: 1}
  - {id: extensibility_integration, definition: Extensibility APIs and integration maturity, weight: 0.2, allowed_claim_categories: [competitor, product, technology], minimum_evidence_count: 1}
  - {id: ai_capability, definition: Verified AI capability within the target workflow, weight: 0.2, allowed_claim_categories: [competitor, product, technology], minimum_evidence_count: 1}
  - {id: ecosystem_maturity, definition: Ecosystem adoption maintenance and activity maturity, weight: 0.2, allowed_claim_categories: [competitor, market, technology], minimum_evidence_count: 1}

rubric:
  id: consumer_app_scoring
  version: 1.0.0
  profile_ref: consumer_app@0.3.2
  integer_only: true
  minimum: 1
  maximum: 10
  aggregation: weighted_arithmetic_mean
  minimum_weight_coverage: 0.8
  missing_evidence: renormalize_available_weights_partial
  tie_break: evidence_coverage_then_shared_rank
  change_rationale: Initial equal-weight consumer-app scoring baseline.
  changelog:
    - {version: 1.0.0, date: "2026-09-01", reason: Initial approved equal-weight baseline.}
score_bands:
  - {minimum: 1, maximum: 2, meaning: Clearly insufficient or supported by negative evidence.}
  - {minimum: 3, maximum: 4, meaning: Limited capability or weak evidence coverage.}
  - {minimum: 5, maximum: 6, meaning: Meets baseline expectations.}
  - {minimum: 7, maximum: 8, meaning: Strong verified capability.}
  - {minimum: 9, maximum: 10, meaning: Clearly leading with multiple direct supporting evidence records.}
dimensions:
  - {id: user_experience, definition: Clarity usability and quality of the user experience, weight: 0.2, allowed_claim_categories: [competitor, product, user], minimum_evidence_count: 1}
  - {id: differentiation, definition: Verified differentiation from current alternatives, weight: 0.2, allowed_claim_categories: [competitor, market, product], minimum_evidence_count: 1}
  - {id: engagement_retention_signal, definition: Observed engagement switching or retention signals, weight: 0.2, allowed_claim_categories: [competitor, market, user], minimum_evidence_count: 1}
  - {id: trust_safety, definition: Verified trust safety and policy behavior, weight: 0.2, allowed_claim_categories: [competitor, product, user], minimum_evidence_count: 1}
  - {id: value_monetization, definition: User value relative to pricing and monetization, weight: 0.2, allowed_claim_categories: [competitor, market, product, user], minimum_evidence_count: 1}

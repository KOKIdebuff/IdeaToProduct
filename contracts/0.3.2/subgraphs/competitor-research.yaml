subgraph:
  id: competitor-research
  version: 0.3.2
  schema_version: 0.3.2

inputs:
  - idea_definition
  - research_contract
  - product_profile
  - source_index

output_contracts:
  - artifact_type: competitor_candidates
    producer: discovery
  - artifact_type: competitor_ranking
    producer: candidate_ranking
  - artifact_type: competitor_deep_dive
    producer: deep_dive
  - artifact_type: competitor_dataset
    producer: normalizer
  - artifact_type: competitor_analysis
    producer: feature_analysis
  - artifact_type: competitor_analysis
    producer: traction_analysis
  - artifact_type: competitor_analysis
    producer: review_analysis
  - artifact_type: competitor_analysis
    producer: pricing_analysis
  - artifact_type: report_projection
    producer: fact_provenance
  - artifact_type: dimension_judgment
    producer: scoring
  - artifact_type: transparent_score
    producer: scoring
  - artifact_type: score_verification
    producer: score_verifier
  - artifact_type: chart_bundle_collection
    producer: chart_rendering
  - artifact_type: report_publication_projection
    producer: report_publication_projection
  - artifact_type: competitor_report
    producer: report_builder
  - artifact_type: competitor_verification
    producer: competitor_verifier

nodes:
  discovery:
    kind: skill
    skill: competitor-discovery
    required: true

  candidate_ranking:
    kind: skill
    skill: competitor-ranking
    depends_on: [discovery]
    required: true

  deep_dive:
    kind: skill
    skill: competitor-deep-dive
    depends_on: [candidate_ranking]
    required: true

  normalizer:
    kind: skill
    skill: competitor-normalizer
    depends_on: [deep_dive]
    required: true

  feature_analysis:
    kind: skill
    skill: competitor-analysis
    depends_on: [normalizer]
    required: true

  traction_analysis:
    kind: skill
    skill: competitor-analysis
    depends_on: [normalizer]
    required: true

  review_analysis:
    kind: skill
    skill: competitor-analysis
    depends_on: [normalizer]
    required: true

  pricing_analysis:
    kind: skill
    skill: competitor-analysis
    depends_on: [normalizer]
    required: true

  fact_provenance:
    kind: skill
    skill: competitor-fact-provenance
    depends_on:
      - feature_analysis
      - traction_analysis
      - review_analysis
      - pricing_analysis
    required: true

  scoring:
    kind: skill
    skill: competitor-scoring
    depends_on: [fact_provenance]
    required: false

  score_verifier:
    kind: verifier
    skill: competitor-score-verifier
    depends_on: [scoring]
    required: false

  chart_rendering:
    kind: skill
    skill: competitor-chart-rendering
    depends_on:
      - fact_provenance
    required: true

  report_publication_projection:
    kind: skill
    skill: report-publication-projection
    depends_on:
      - fact_provenance
      - chart_rendering
    required: true

  report_builder:
    kind: skill
    skill: competitor-report-builder
    depends_on:
      - report_publication_projection
    required: true

  competitor_verifier:
    kind: verifier
    skill: competitor-verifier
    depends_on: [report_builder]
    required: true

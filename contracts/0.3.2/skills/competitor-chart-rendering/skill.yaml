skill:
  id: competitor-chart-rendering
  version: 0.3.2
  type: generator
inputs:
  required: [competitor_dataset, competitor_analysis, research_contract, product_profile, report_projection]
  optional: [source_index]
reads:
  - artifacts/01-contract/research-contract.yaml
  - artifacts/02-research/competitors/competitor-dataset.json
  - artifacts/02-research/competitors/analysis/
  - artifacts/02-research/competitors/report-projection.json
  - artifacts/02-research/source-index.json
  - profiles/
  - chart-templates/registry.yaml
writes:
  - artifacts/02-research/competitors/visualizations/
output_contracts:
  - artifact_type: chart_bundle_collection
    write: artifacts/02-research/competitors/visualizations/
    schema_ref: schemas/chart.schema.json#/$defs/chart_bundle_collection
    template_ref: null
evidence:
  required: true
  provenance_required: true
permissions:
  external_access: none
  workspace_write: [artifacts/02-research/competitors/visualizations/]
  secrets: forbidden
budget: {timeout_minutes: 20, max_sources: 0}
executor:
  allowed_adapter_types: [fixture, manual, host_agent]
completion:
  required_outputs: [chart_bundle_collection]
  profile_visualizations_complete: true
  canonical_svg_required: true
  native_renderer_registry_required: true
  png_compatibility_failure_status: PARTIAL
on_failure: [emit_research_gap]

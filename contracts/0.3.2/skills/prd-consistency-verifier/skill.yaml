  optional: [proof_result, accepted_risk_decisions]
reads:
  - artifacts/07-prd/prd.md
  - artifacts/03-analysis/research-synthesis.md
  - artifacts/05-product/product-definition.md
  - artifacts/05-product/mvp-scope.yaml
  - artifacts/06-feasibility/feasibility.md
  - artifacts/06-feasibility/proof-result.yaml
writes:
  - artifacts/07-prd/prd-consistency-verification.yaml
output_contracts:

skill:
  id: competitor-verifier
  version: 0.2.0
  type: verifier
inputs:
  required: [research_contract, competitor_candidates, competitor_ranking, competitor_deep_dive, competitor_dataset, competitor_analysis, chart_bundle, competitor_report]
  optional: [source_index]
reads:
  - artifacts/01-contract/research-contract.yaml
  - artifacts/02-research/competitors/candidates.json
  - artifacts/02-research/competitors/ranking.yaml
  - artifacts/02-research/competitors/deep-dives/
  - artifacts/02-research/competitors/competitor-dataset.json
  - artifacts/02-research/competitors/analysis/
  - artifacts/02-research/competitors/visualizations/
  - artifacts/02-research/competitors/competitor-report.md
  - artifacts/02-research/source-index.json
writes:
  - artifacts/02-research/competitors/competitor-verification.yaml
output_contracts:
  - artifact_type: competitor_verification
    write: artifacts/02-research/competitors/competitor-verification.yaml
    schema_ref: schemas/verification.schema.json#/$defs/competitor_verification
    template_ref: null
evidence:
  required: true
  provenance_required: true
permissions:
  external_access: none
  workspace_write:
    - artifacts/02-research/competitors/competitor-verification.yaml
  secrets: forbidden
budget:
  timeout_minutes: 20
  max_sources: 0
executor:
  allowed_adapter_types: [fixture, manual, host_agent]
completion:
  required_outputs: [competitor_verification]
  retry_targets_required_on_gap: true
  return_to: competitor_verifier
on_failure: []

skill:
  id: user-evidence
  version: 0.3.1
  type: research
inputs:
  required: [idea_definition, research_contract]
  optional: [source_index]
reads:
  - artifacts/00-intake/idea-definition.yaml
  - artifacts/01-contract/research-contract.yaml
  - artifacts/02-research/source-index.json
writes:
  - artifacts/02-research/user-evidence.json
output_contracts:
  - artifact_type: user_evidence
    write: artifacts/02-research/user-evidence.json
    schema_ref: schemas/research.schema.json#/$defs/user_evidence
    template_ref: null
evidence:
  required: true
  provenance_required: true
permissions:
  external_access: read_only
  workspace_write:
    - artifacts/02-research/user-evidence.json
  secrets: forbidden
budget:
  timeout_minutes: 20
  max_sources: 50
executor:
  allowed_adapter_types: [fixture, manual, host_agent]
completion:
  required_outputs: [user_evidence]
  contract_thresholds_applied: true
on_failure: [emit_research_gap]

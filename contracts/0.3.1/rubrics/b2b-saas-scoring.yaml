rubric:
  id: b2b_saas_scoring
  version: 1.0.0
  profile_ref: b2b_saas@0.3.1
  integer_only: true
  minimum: 1
  maximum: 10
  aggregation: weighted_arithmetic_mean
  minimum_weight_coverage: 0.8
  missing_evidence: renormalize_available_weights_partial
  tie_break: evidence_coverage_then_shared_rank
  change_rationale: Initial equal-weight B2B-SaaS scoring baseline.
  changelog:
    - {version: 1.0.0, date: "2026-09-01", reason: Initial approved equal-weight baseline.}
score_bands:
  - {minimum: 1, maximum: 2, meaning: Clearly insufficient or supported by negative evidence.}
  - {minimum: 3, maximum: 4, meaning: Limited capability or weak evidence coverage.}
  - {minimum: 5, maximum: 6, meaning: Meets baseline expectations.}
  - {minimum: 7, maximum: 8, meaning: Strong verified capability.}
  - {minimum: 9, maximum: 10, meaning: Clearly leading with multiple direct supporting evidence records.}
dimensions:
  - {id: workflow_fit, definition: Fit with the buyer and end-user workflow, weight: 0.2, allowed_claim_categories: [competitor, product, user], minimum_evidence_count: 1}
  - {id: integration_maturity, definition: Integration breadth depth and operational maturity, weight: 0.2, allowed_claim_categories: [competitor, product, technology], minimum_evidence_count: 1}
  - {id: security_compliance, definition: Verified security compliance and administrative controls, weight: 0.2, allowed_claim_categories: [competitor, product, technology], minimum_evidence_count: 1}
  - {id: commercial_fit, definition: Pricing procurement licensing and commercial fit, weight: 0.2, allowed_claim_categories: [competitor, market, product], minimum_evidence_count: 1}
  - {id: differentiation, definition: Verified differentiation from B2B alternatives, weight: 0.2, allowed_claim_categories: [competitor, market, product], minimum_evidence_count: 1}

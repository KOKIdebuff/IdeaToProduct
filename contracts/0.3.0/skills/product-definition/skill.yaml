skill:
  id: product-definition
  version: 0.3.0
  type: generator
inputs:
  required: [opportunity_map, product_direction_decision]
  optional: [research_synthesis]
reads:
  - artifacts/03-analysis/opportunities.yaml
  - artifacts/03-analysis/research-synthesis.md
  - templates/product-definition.md
writes:
  - artifacts/05-product/product-definition.md
output_contracts:
  - artifact_type: product_definition
    write: artifacts/05-product/product-definition.md
    schema_ref: schemas/artifact.schema.json
    template_ref: templates/product-definition.md
evidence:
  required: true
  provenance_required: true
permissions:
  external_access: none
  workspace_write:
    - artifacts/05-product/product-definition.md
  secrets: forbidden
budget:
  timeout_minutes: 20
  max_sources: 0
executor:
  allowed_adapter_types: [fixture, manual, host_agent]
completion:
  required_outputs: [product_definition]
  approved_direction_preserved: true
on_failure: []

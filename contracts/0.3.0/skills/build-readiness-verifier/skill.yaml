skill:
  id: build-readiness-verifier
  version: 0.3.0
  type: verifier
inputs:
  required: [effective_workflow, research_verification, product_definition, feasibility_review, mvp_scope, prd, prd_consistency_verification]
  optional: [evidence_waiver_decision, proof_result, accepted_risk_decisions]
reads:
  - workflow.yaml
  - artifacts/03-analysis/research-verification.yaml
  - artifacts/05-product/product-definition.md
  - artifacts/05-product/mvp-scope.yaml
  - artifacts/06-feasibility/feasibility.md
  - artifacts/06-feasibility/proof-result.yaml
  - artifacts/07-prd/prd.md
  - artifacts/07-prd/prd-consistency-verification.yaml
writes:
  - artifacts/07-prd/readiness-result.yaml
output_contracts:
  - artifact_type: readiness_result
    write: artifacts/07-prd/readiness-result.yaml
    schema_ref: schemas/readiness-result.schema.json#/$defs/readiness_result
    template_ref: null
evidence:
  required: true
  provenance_required: true
permissions:
  external_access: none
  workspace_write:
    - artifacts/07-prd/readiness-result.yaml
  secrets: forbidden
budget:
  timeout_minutes: 20
  max_sources: 0
executor:
  allowed_adapter_types: [fixture, manual, host_agent]
completion:
  required_outputs: [readiness_result]
  unique_readiness_writer: true
on_failure: []
